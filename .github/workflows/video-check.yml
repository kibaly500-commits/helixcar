name: Vérification vidéo services
on: push
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          git fetch --depth=1 origin 490cc419ec66f220a8c02fd778e6b7bbe23cf5cc
          git show 490cc419ec66f220a8c02fd778e6b7bbe23cf5cc:index.html > index-baseline.html
      - name: Lecture réelle et commandes Chromium et WebKit
        run: node tests/verification-video.cjs
      - name: Navigation et cadrage
        if: always()
        env:
          CI_NO_SANDBOX: '1'
        run: node tests/t_vitrine_navigation.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-services-captures
          path: /tmp/video-*.png
