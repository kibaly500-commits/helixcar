name: Verification pied de page
on: [push]
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/verification-footer.cjs
      - run: node tests/t_vitrine_navigation.js && node tests/t_vitrine_renfort.js
        env:
          CI_NO_SANDBOX: '1'
