name: Verification animation
on: [push]
jobs:
  animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Repeter les seuils et controles negatifs
        run: for i in 1 2 3 4 5; do node tests/t_pr6_synchronisation_delais.js || exit 1; done
        env:
          CI_NO_SANDBOX: '1'
