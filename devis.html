<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre devis HelixCar</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --rouge: #E5484D;
    --rouge-fonce: #C93A3E;
    --anthracite: #14181D;
    --anthracite-clair: #454C55;
    --ivoire: #F7F3EC;
    --blanc: #FFFFFF;
    --gris: #7D8288;
    --ligne: #E4E0D8;
    --ok: #2E7D4F;
    --refus: #A33A3A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ivoire);
    color: var(--anthracite);
    line-height: 1.45;
  }
  a { color: inherit; }
  .voile {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── En-tête, identité HelixCar reprise du devis PDF ── */
  header.entete {
    background: var(--anthracite);
    padding: 22px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--blanc);
  }
  .logo span { color: var(--rouge); }
  .entete-sous {
    color: #9AA0A8;
    font-size: 0.82rem;
  }

  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  /* ── États simples (chargement / erreur) ── */
  .etat-simple {
    text-align: center;
    padding: 70px 20px;
  }
  .etat-simple .icone {
    font-size: 2.2rem;
    margin-bottom: 14px;
  }
  .etat-simple h1 {
    font-size: 1.25rem;
    margin: 0 0 8px;
  }
  .etat-simple p {
    color: var(--anthracite-clair);
    font-size: 0.95rem;
    max-width: 420px;
    margin: 0 auto;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--ligne);
    border-top-color: var(--rouge);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: tourner 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
  @keyframes tourner { to { transform: rotate(360deg); } }

  /* ── Carte devis (état réussi) ── */
  .carte {
    background: var(--blanc);
    border-radius: 3px;
    box-shadow: 0 1px 3px rgba(20,24,29,0.08);
    overflow: hidden;
    margin-bottom: 18px;
    position: relative;
  }
  .carte::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--rouge);
  }
  .carte-corps { padding: 24px 24px 24px 28px; }

  .ligne-tete {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .reference {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 0.92rem;
    letter-spacing: 0.04em;
    border: 1.5px solid var(--anthracite);
    padding: 5px 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .montant {
    font-size: 2rem;
    font-weight: 800;
    color: var(--anthracite);
    line-height: 1;
  }
  .montant-libelle {
    font-size: 0.72rem;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .badge.attente { background: #FDF0D5; color: #8A5A00; }
  .badge.accepte { background: #E3F2E8; color: var(--ok); }
  .badge.refuse  { background: #F5E3E3; color: var(--refus); }

  .section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--rouge);
    margin: 22px 0 10px;
    padding-top: 16px;
    border-top: 1px solid var(--ligne);
  }
  .section-titre:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  .grille-info {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px 20px;
  }
  .info-libelle {
    font-size: 0.7rem;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .info-valeur {
    font-size: 0.94rem;
    font-weight: 600;
  }

  .vehicule-bloc {
    border: 1px solid var(--ligne);
    border-radius: 2px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .vehicule-bloc:last-child { margin-bottom: 0; }
  .vehicule-titre {
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .tag {
    font-size: 0.72rem;
    background: var(--ivoire);
    border: 1px solid var(--ligne);
    padding: 3px 9px;
    border-radius: 20px;
    color: var(--anthracite-clair);
  }

  /* ── Boutons ── */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }
  .bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 18px;
    border-radius: 2px;
    font-size: 0.94rem;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .bouton:focus-visible {
    outline: 3px solid var(--rouge);
    outline-offset: 2px;
  }
  .bouton-pdf {
    background: var(--anthracite);
    color: var(--blanc);
  }
  .bouton-pdf:hover { background: #23282F; }
  .bouton-telechargement {
    background: var(--blanc);
    color: var(--anthracite);
    border: 1.5px solid var(--anthracite);
  }
  .bouton-telechargement:hover { background: var(--ivoire); }

  .decision-groupe {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .bouton-accepter, .bouton-refuser {
    background: var(--blanc);
    color: var(--gris);
    border: 1.5px solid var(--ligne);
    cursor: not-allowed;
    flex-direction: column;
    padding: 14px 10px;
    gap: 3px;
  }
  .bouton-etiquette-bientot {
    font-size: 0.68rem;
    font-weight: 500;
    text-transform: none;
    color: var(--gris);
  }

  .statut-final {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-radius: 2px;
    font-size: 0.92rem;
    margin-top: 4px;
  }
  .statut-final.accepte { background: #E3F2E8; color: #1E5734; }
  .statut-final.refuse { background: #F5E3E3; color: #7A2B2B; }
  .statut-final strong { display: block; font-size: 1rem; margin-bottom: 2px; }

  .pdf-indispo {
    font-size: 0.85rem;
    color: var(--gris);
    text-align: center;
    padding: 10px;
  }

  footer.pied {
    text-align: center;
    padding: 24px;
    font-size: 0.76rem;
    color: var(--gris);
  }

  @media (max-width: 480px) {
    .montant { font-size: 1.6rem; }
    .carte-corps { padding: 20px 18px 20px 22px; }
    .decision-groupe { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="voile">
  <header class="entete">
    <div class="logo">HELIX<span>CAR</span></div>
    <div class="entete-sous">Consultation de devis</div>
  </header>

  <main id="zone-contenu">
    <!-- Le contenu est injecté par JS selon l'état : chargement / erreur / devis -->
    <div class="etat-simple" id="etat-chargement">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Chargement de votre devis…</h1>
    </div>
  </main>

  <footer class="pied">HelixCar — Convoyage &amp; stockage automobile</footer>
</div>

<script>
(function () {
  "use strict";

  var URL_FONCTION = "https://zsetmqnmmupqbkgqbjbo.supabase.co/functions/v1/devis-secure";
  var zone = document.getElementById('zone-contenu');

  // ────────────────────────────────────────────────────────────
  // Sécurité : le token ne vit qu'en mémoire (variable locale de
  // cette fonction). Jamais écrit dans localStorage/sessionStorage,
  // jamais loggé, jamais affiché à l'écran.
  // ────────────────────────────────────────────────────────────
  function lireTokenDepuisUrl() {
    try {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    } catch (e) {
      return null;
    }
  }

  function afficherEtatSimple(icone, titre, message) {
    zone.innerHTML =
      '<div class="etat-simple">' +
        '<div class="icone" aria-hidden="true">' + icone + '</div>' +
        '<h1>' + titre + '</h1>' +
        '<p>' + message + '</p>' +
      '</div>';
  }

  function texteOuTiret(v) { return (v === null || v === undefined || v === '') ? null : v; }

  function formaterDate(iso) {
    if (!iso) return null;
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return iso; }
  }

  function formaterMontant(prix) {
    if (prix === null || prix === undefined) return '—';
    try {
      return Number(prix).toLocaleString('fr-FR') + ' €';
    } catch (e) { return prix + ' €'; }
  }

  var LIBELLES_SERVICE = {
    convoyage: 'Convoyage automobile',
    stockage: 'Stockage automobile',
    convoyage_stockage: 'Convoyage + stockage'
  };

  // V50.5C.1A — Échappement systématique de TOUTE valeur dynamique avant
  // insertion dans innerHTML. Les fragments HTML fixes construits par ce
  // fichier lui-même (balises, classes) ne passent jamais par cette
  // fonction — seules les VALEURS (référence, nom client, adresses,
  // dates formatées, etc.) le font.
  function echapperHtml(valeur) {
    if (valeur === null || valeur === undefined) return '';
    return String(valeur)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function ligneInfo(libelle, valeur) {
    if (!valeur) return '';
    return '<div><div class="info-libelle">' + libelle + '</div><div class="info-valeur">' + echapperHtml(valeur) + '</div></div>';
  }

  // Construit la ligne "trajet" (départ/arrivée/dates/horaires/mode),
  // utilisée aussi bien pour le trajet dossier (mono) que pour le
  // trajet propre à un véhicule (multi) — même structure de champs.
  function blocTrajet(t) {
    if (!t) return '';
    var champs = '';
    var depart = [t.adresse_depart_rue, t.ville_depart].filter(Boolean).join(', ') || t.ville_depart;
    var arrivee = [t.adresse_arrivee_rue, t.ville_arrivee].filter(Boolean).join(', ') || t.ville_arrivee;
    champs += ligneInfo('Départ', depart);
    champs += ligneInfo('Arrivée', arrivee);
    champs += ligneInfo('Prise en charge', [formaterDate(t.date_prise_en_charge), t.horaire_prise_en_charge].filter(Boolean).join(' — '));
    champs += ligneInfo('Livraison', [formaterDate(t.date_livraison), t.horaire_livraison].filter(Boolean).join(' — '));
    if (!champs) return '';
    return '<div class="grille-info">' + champs + '</div>';
  }

  function blocStockage(s) {
    if (!s) return '';
    var champs = '';
    champs += ligneInfo('Début du stockage', formaterDate(s.date_debut));
    champs += ligneInfo('Fin prévue', formaterDate(s.date_fin_prevue));
    champs += ligneInfo('Durée', s.nb_jours ? (s.nb_jours + (s.nb_jours > 1 ? ' jours' : ' jour')) : null);
    champs += ligneInfo('Heure d\'entrée', s.heure_entree);
    champs += ligneInfo('Heure de récupération', s.heure_sortie);
    if (!champs) return '';
    return '<div class="section-titre">Stockage</div><div class="grille-info">' + champs + '</div>';
  }

  function blocRestitution(r) {
    if (!r) return '';
    var champs = '';
    champs += ligneInfo('Adresse de restitution', r.adresse);
    champs += ligneInfo('Date', formaterDate(r.date));
    champs += ligneInfo('Horaire', r.horaire);
    if (!champs) return '';
    return '<div class="section-titre">Restitution</div><div class="grille-info">' + champs + '</div>';
  }

  function blocVehicules(snapshot) {
    if (!snapshot.vehicules || !snapshot.vehicules.length) return '';
    var html = '<div class="section-titre">Véhicule' + (snapshot.vehicules.length > 1 ? 's' : '') + '</div>';
    snapshot.vehicules.forEach(function (v, i) {
      html += '<div class="vehicule-bloc">';
      html += '<div class="vehicule-titre">' + (snapshot.vehicules.length > 1 ? 'Véhicule ' + echapperHtml(v.position || (i + 1)) : echapperHtml(v.marque_modele || 'Véhicule')) + '</div>';
      var champs = '';
      champs += ligneInfo('Type', v.type_vehicule);
      champs += ligneInfo('Marque / modèle', v.marque_modele);
      champs += ligneInfo('Immatriculation', v.immatriculation);
      if (champs) html += '<div class="grille-info">' + champs + '</div>';
      if (v.trajet) html += blocTrajet(v.trajet);
      if (v.restitution) html += blocRestitution(v.restitution);
      html += '</div>';
    });
    return html;
  }

  function badgeStatut(statut) {
    if (statut === 'accepte') return '<span class="badge accepte">Accepté</span>';
    if (statut === 'refuse') return '<span class="badge refuse">Refusé</span>';
    return '<span class="badge attente">En attente de réponse</span>';
  }

  // V50.5C.1A — Validation stricte de l'URL PDF avant toute utilisation
  // dans un href : protocole https: obligatoire, hostname strictement
  // égal à celui du projet Supabase attendu. Toute URL qui ne respecte
  // pas ces deux critères est traitée comme absente — jamais construite
  // manuellement, jamais utilisée telle quelle sans validation.
  var HOSTNAME_SUPABASE_ATTENDU = 'zsetmqnmmupqbkgqbjbo.supabase.co';
  function urlPdfValideOuNull(urlBrute) {
    if (!urlBrute || typeof urlBrute !== 'string') return null;
    var u;
    try {
      u = new URL(urlBrute);
    } catch (e) {
      return null;
    }
    if (u.protocol !== 'https:') return null;
    if (u.hostname !== HOSTNAME_SUPABASE_ATTENDU) return null;
    return u.href;
  }

  function blocActions(devis) {
    // Objectif V50.5C.1 : GET + PDF uniquement. Accepter/Refuser sont
    // visuellement présents mais non actifs — branchés dans une étape
    // suivante.
    var urlPdf = urlPdfValideOuNull(devis.pdf_url);
    var pdf = '';
    if (devis.pdf_disponible && urlPdf) {
      pdf =
        '<a class="bouton bouton-pdf" href="' + echapperHtml(urlPdf) + '" target="_blank" rel="noopener">Consulter mon devis PDF</a>' +
        '<a class="bouton bouton-telechargement" href="' + echapperHtml(urlPdf) + '" download>Télécharger le devis</a>';
    } else {
      pdf = '<p class="pdf-indispo">Le PDF de ce devis n\'est pas disponible pour le moment.</p>';
    }

    if (devis.statut === 'accepte') {
      return pdf + '<div class="actions"><div class="statut-final accepte">' +
        '<div><strong>Devis accepté</strong>' +
        (devis.date_acceptation ? 'le ' + echapperHtml(formaterDate(devis.date_acceptation)) : '') +
        '</div></div></div>';
    }
    if (devis.statut === 'refuse') {
      return pdf + '<div class="actions"><div class="statut-final refuse">' +
        '<div><strong>Devis refusé</strong>' +
        (devis.date_refus ? 'le ' + echapperHtml(formaterDate(devis.date_refus)) : '') +
        '</div></div></div>';
    }
    return pdf +
      '<div class="actions">' +
        '<div class="decision-groupe">' +
          '<button class="bouton bouton-accepter" disabled title="Étape suivante">' +
            '<span>Accepter le devis</span>' +
            '<span class="bouton-etiquette-bientot">Bientôt disponible</span>' +
          '</button>' +
          '<button class="bouton bouton-refuser" disabled title="Étape suivante">' +
            '<span>Refuser le devis</span>' +
            '<span class="bouton-etiquette-bientot">Bientôt disponible</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  function afficherDevis(devis) {
    var snapshot = devis.snapshot || {};
    var html = '<div class="carte"><div class="carte-corps">';

    html += '<div class="ligne-tete">';
    html += '<div><div class="reference">' + echapperHtml(devis.reference || '—') + '</div></div>';
    html += '<div style="text-align:right"><div class="montant-libelle">Montant</div><div class="montant">' + echapperHtml(formaterMontant(devis.prix)) + '</div></div>';
    html += '</div>';

    html += '<div style="margin-bottom:16px">' + badgeStatut(devis.statut) + '</div>';

    // Informations principales de la prestation.
    var infoPrincipale = '';
    if (snapshot.client && snapshot.client.nom_complet) infoPrincipale += ligneInfo('Client', snapshot.client.nom_complet);
    if (snapshot.type_service) infoPrincipale += ligneInfo('Prestation', LIBELLES_SERVICE[snapshot.type_service] || snapshot.type_service);
    if (snapshot.nombre_vehicules) infoPrincipale += ligneInfo('Nombre de véhicules', String(snapshot.nombre_vehicules));
    infoPrincipale += ligneInfo('Devis envoyé le', formaterDate(devis.date_envoi));
    if (infoPrincipale) html += '<div class="section-titre">Votre demande</div><div class="grille-info">' + infoPrincipale + '</div>';

    // Trajet dossier (mono uniquement — cf. structure snapshot).
    var trajetDossier = blocTrajet(snapshot.trajet);
    if (trajetDossier) html += '<div class="section-titre">Trajet</div>' + trajetDossier;

    html += blocStockage(snapshot.stockage);
    html += blocVehicules(snapshot);
    html += blocRestitution(snapshot.restitution);

    var tags = [];
    if (snapshot.options) {
      if (snapshot.options.urgence) tags.push('Urgent');
      if (snapshot.options.plateau) tags.push('Transport sur plateau');
    }
    if (tags.length) {
      html += '<div class="tags">' + tags.map(function (t) { return '<span class="tag">' + echapperHtml(t) + '</span>'; }).join('') + '</div>';
    }

    html += '</div></div>'; // fin carte-corps / carte

    html += blocActions(devis);

    zone.innerHTML = html;
  }

  function demarrer() {
    var token = lireTokenDepuisUrl();

    if (!token) {
      afficherEtatSimple('⚠️', 'Lien de devis invalide.', 'Le lien que vous avez utilisé ne contient pas les informations nécessaires. Vérifiez qu\'il a été copié en entier depuis votre email.');
      return;
    }

    fetch(URL_FONCTION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // Aucun JWT Supabase requis côté client — le token est la seule
      // preuve d'accès, transmis une fois, jamais journalisé.
      body: JSON.stringify({ action: 'get', token: token })
    })
      .then(function (reponse) {
        return reponse.json().then(function (corps) {
          return { statutHttp: reponse.status, corps: corps };
        }).catch(function () {
          return { statutHttp: reponse.status, corps: null };
        });
      })
      .then(function (resultat) {
        var corps = resultat.corps;
        if (!corps || corps.ok !== true) {
          var code = corps && corps.code;
          if (code === 'INVALID_OR_EXPIRED_LINK') {
            afficherEtatSimple('🔒', 'Lien invalide ou expiré.', 'Ce lien de devis est invalide ou a expiré. Contactez HelixCar si vous pensez qu\'il s\'agit d\'une erreur.');
          } else {
            afficherEtatSimple('⚠️', 'Impossible d\'afficher ce devis.', 'Une erreur est survenue. Merci de réessayer dans quelques instants.');
          }
          return;
        }
        afficherDevis(corps.devis);
      })
      .catch(function () {
        // Erreur réseau générique — jamais de détail technique exposé au
        // client, jamais le token dans un log.
        afficherEtatSimple('📡', 'Problème de connexion.', 'Impossible de contacter HelixCar pour le moment. Vérifiez votre connexion internet et réessayez.');
      });
  }

  demarrer();
})();
</script>
</body>
</html>
