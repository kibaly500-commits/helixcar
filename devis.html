<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Votre devis HelixCar</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --rouge: #E5484D;
    --anthracite: #14181D;
    --anthracite-clair: #454C55;
    --ivoire: #F7F3EC;
    --blanc: #FFFFFF;
    --gris: #7D8288;
    --ligne: #E4E0D8;
    --ok: #2E7D4F;
    --refus: #A33A3A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ivoire);
    color: var(--anthracite);
    line-height: 1.45;
  }
  .voile { min-height: 100vh; display: flex; flex-direction: column; }

  header.entete {
    background: var(--anthracite);
    padding: 20px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.01em; color: var(--blanc); }
  .logo span { color: var(--rouge); }
  .entete-sous { color: #9AA0A8; font-size: 0.8rem; }

  main {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .etat-simple { text-align: center; padding: 70px 20px; }
  .etat-simple .icone { font-size: 2.2rem; margin-bottom: 14px; }
  .etat-simple h1 { font-size: 1.2rem; margin: 0 0 8px; }
  .etat-simple p { color: var(--anthracite-clair); font-size: 0.94rem; max-width: 420px; margin: 0 auto; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--ligne);
    border-top-color: var(--rouge);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: tourner 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  @keyframes tourner { to { transform: rotate(360deg); } }

  .entete-devis {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .reference {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    border: 1.5px solid var(--anthracite);
    padding: 5px 10px;
    border-radius: 2px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .titre-devis { font-size: 1rem; color: var(--anthracite-clair); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 18px; }
  .badge.attente { background: #FDF0D5; color: #8A5A00; }
  .badge.accepte { background: #E3F2E8; color: var(--ok); }
  .badge.refuse  { background: #F5E3E3; color: var(--refus); }

  /* ── Le vrai PDF, pièce centrale de la page ── */
  .pdf-cadre {
    background: var(--blanc);
    border: 1px solid var(--ligne);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .pdf-cadre iframe {
    display: block;
    width: 100%;
    height: 85vh;
    min-height: 480px;
    border: none;
  }
  .pdf-indispo { font-size: 0.9rem; color: var(--gris); text-align: center; padding: 50px 16px; }

  .bouton {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 18px; border-radius: 2px; font-size: 0.94rem; font-weight: 600;
    text-decoration: none; border: none; cursor: pointer; width: 100%;
  }
  .bouton:focus-visible { outline: 3px solid var(--rouge); outline-offset: 2px; }
  .bouton:disabled { opacity: 0.55; cursor: not-allowed; }
  .bouton-pdf { background: var(--anthracite); color: var(--blanc); margin-bottom: 22px; }
  .bouton-pdf:hover { background: #23282F; }

  .question-actions { font-size: 0.95rem; font-weight: 600; margin: 6px 0 12px; }
  .decision-groupe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bouton-accepter { background: var(--ok); color: var(--blanc); }
  .bouton-accepter:hover:not(:disabled) { background: #256640; }
  .bouton-refuser { background: var(--blanc); color: var(--refus); border: 1.5px solid var(--refus); }
  .bouton-refuser:hover:not(:disabled) { background: #FBF1F1; }

  .statut-final {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-radius: 2px; font-size: 0.92rem; margin-top: 4px;
  }
  .statut-final.accepte { background: #E3F2E8; color: #1E5734; }
  .statut-final.refuse { background: #F5E3E3; color: #7A2B2B; }
  .statut-final strong { display: block; font-size: 1rem; margin-bottom: 2px; }

  footer.pied { text-align: center; padding: 24px; font-size: 0.76rem; color: var(--gris); }

  /* ── Modal (confirmation acceptation / motif de refus) ── */
  /* V50.5D.3E-A — verrouillage de scroll d'arrière-plan pendant que la
     modale est ouverte. Règle de base = desktop, simple overflow:hidden
     (déjà suffisant hors contexte tactile). Étendue en position:fixed
     uniquement sur mobile (cf. media query plus bas), seule technique
     fiable sur Safari iOS. */
  body.scroll-verrouille { overflow: hidden; }

  .voile-modal {
    position: fixed; inset: 0; background: rgba(20,24,29,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 100;
  }
  .voile-modal[hidden] { display: none; }
  .modal-carte {
    background: var(--blanc); border-radius: 3px; max-width: 420px; width: 100%;
    padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .modal-titre { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; }
  .modal-texte { font-size: 0.92rem; color: var(--anthracite-clair); margin-bottom: 14px; }
  .modal-champ {
    width: 100%; min-height: 90px; padding: 10px; border: 1.5px solid var(--ligne);
    border-radius: 2px; font-family: inherit; font-size: 0.9rem; resize: vertical;
  }
  .modal-compteur { font-size: 0.74rem; color: var(--gris); text-align: right; margin-top: 4px; }
  .modal-erreur { font-size: 0.85rem; color: var(--refus); margin-top: 10px; display: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .bouton { width: auto; flex: 1; padding: 11px 14px; font-size: 0.9rem; }
  .bouton-annuler { background: var(--ivoire); color: var(--anthracite); border: 1.5px solid var(--ligne); }
  .bouton-confirmer-refus { background: var(--refus); color: var(--blanc); }
  .bouton-confirmer-accept { background: var(--ok); color: var(--blanc); }

  /* ══════════════════════════════════════════════════════════════
     V50.5D.3E — RESPONSIVE MOBILE COMPLET (devis.html)
     Tout ce bloc est conditionné à des max-width : le rendu ≥769px
     reste strictement celui déjà validé, aucune règle ici ne
     s'applique au-delà de ce seuil. Le vrai PDF n'est jamais
     reconstruit ni régénéré : seul son conteneur/iframe est adapté.
     ══════════════════════════════════════════════════════════════ */
  @media (max-width: 768px) {
    header.entete {
      padding: 16px 18px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .logo { font-size: 1.2rem; }
    .entete-sous { font-size: 0.74rem; }

    main {
      padding: 18px 14px 48px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }

    .entete-devis { gap: 8px; }
    .reference { font-size: 0.84rem; padding: 4px 9px; }
    .titre-devis { font-size: 0.92rem; }

    /* PDF — hauteur en unités modernes (dvh/svh) avec repli vh pour
       navigateurs plus anciens : dvh s'ajuste dynamiquement à la barre
       d'adresse mobile (Safari iOS notamment), évitant l'instabilité
       classique du vh pur pendant le scroll. La ligne vh reste en
       premier comme repli : les navigateurs sans support dvh/svh
       ignorent silencieusement la ligne suivante et gardent celle-ci. */
    .pdf-cadre iframe {
      height: 70vh;
      height: 70dvh;
      min-height: 380px;
    }

    .bouton { min-height: 48px; font-size: 0.92rem; }
    .decision-groupe { grid-template-columns: 1fr; gap: 10px; }

    /* ── Modale (confirmation acceptation / motif refus) ──────────
       Ne devient pas plein écran (contenu court, garde son rôle de
       confirmation) mais ne doit jamais déborder ni être coupée par
       le clavier virtuel : hauteur maximale contrainte avec son PROPRE
       scroll interne si le contenu + clavier dépasse le viewport. */
    .voile-modal {
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      align-items: center;
    }
    /* Verrouillage robuste de l'arrière-plan (voir JS
       _verrouillerScrollArrierePlan/_deverrouillerScrollArrierePlan) :
       .modal-carte reste l'UNIQUE élément scrollable pendant que la
       modale est ouverte — l'arrière-plan (page devis.html complète)
       ne peut plus défiler du tout, sur aucun geste, y compris hors de
       .modal-carte. */
    body.scroll-verrouille {
      position: fixed;
      top: var(--scroll-lock-top, 0px);
      left: 0; right: 0; width: 100%;
    }
    .modal-carte {
      max-width: 100%;
      width: 100%;
      max-height: min(88vh, 88dvh);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 20px 18px;
    }
    .modal-titre { font-size: 1rem; }
    .modal-champ { font-size: 16px; } /* évite le zoom automatique iOS au focus */
    .modal-actions { flex-direction: column-reverse; gap: 8px; }
    .modal-actions .bouton { width: 100%; min-height: 46px; }

    footer.pied {
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 480px) {
    .pdf-cadre iframe {
      height: 60vh;
      height: 60dvh;
      min-height: 320px;
    }
    .bouton-pdf { margin-bottom: 16px; }
    header.entete { flex-direction: column; align-items: flex-start; gap: 2px; }
  }

  @media (max-width: 360px) {
    .logo { font-size: 1.08rem; }
    .reference { font-size: 0.78rem; }
  }

  /* Téléphone à plat (paysage) : le PDF ne doit pas devenir minuscule
     ni forcer un débordement vertical excessif de la page. */
  @media (max-width: 900px) and (orientation: landscape) {
    .pdf-cadre iframe { height: 78vh; height: 78dvh; min-height: 240px; }
    .modal-carte { max-height: min(80vh, 80dvh); }
  }
</style>
</head>
<body>
<div class="voile">
  <header class="entete">
    <div class="logo">HELIX<span>CAR</span></div>
    <div class="entete-sous">Consultation de devis</div>
  </header>

  <main id="zone-contenu">
    <div class="etat-simple" id="etat-chargement">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Chargement de votre devis…</h1>
    </div>
  </main>

  <footer class="pied">HelixCar — Convoyage &amp; stockage automobile</footer>
</div>

<!-- Modal générique, réutilisé pour la confirmation d'acceptation ET la saisie du motif de refus. -->
<div class="voile-modal" id="voile-modal" hidden>
  <div class="modal-carte" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
    <div class="modal-titre" id="modal-titre"></div>
    <div class="modal-texte" id="modal-texte"></div>
    <div id="modal-zone-champ"></div>
    <div class="modal-erreur" id="modal-erreur"></div>
    <div class="modal-actions">
      <button class="bouton bouton-annuler" id="modal-bouton-annuler">Annuler</button>
      <button class="bouton" id="modal-bouton-confirmer">Confirmer</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var URL_FONCTION = "https://zsetmqnmmupqbkgqbjbo.supabase.co/functions/v1/devis-secure";
  var HOSTNAME_SUPABASE_ATTENDU = "zsetmqnmmupqbkgqbjbo.supabase.co";
  var MOTIF_LONGUEUR_MAX = 500;
  var zone = document.getElementById('zone-contenu');

  // ────────────────────────────────────────────────────────────
  // Token : lu une seule fois depuis l'URL, conservé en mémoire dans
  // cette closure de module — jamais localStorage/sessionStorage,
  // jamais loggé, jamais affiché.
  // ────────────────────────────────────────────────────────────
  var token = null;
  try {
    token = new URLSearchParams(window.location.search).get('token');
  } catch (e) { token = null; }

  var enCoursTraitement = false; // protection double-clic partagée accept/refuse

  // ── Échappement HTML (V50.5C.1A, conservé à l'identique) ──
  function echapperHtml(valeur) {
    if (valeur === null || valeur === undefined) return '';
    return String(valeur)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── Validation stricte URL PDF (V50.5C.1A, conservée à l'identique) ──
  function urlPdfValideOuNull(urlBrute) {
    if (!urlBrute || typeof urlBrute !== 'string') return null;
    var u;
    try { u = new URL(urlBrute); } catch (e) { return null; }
    if (u.protocol !== 'https:') return null;
    if (u.hostname !== HOSTNAME_SUPABASE_ATTENDU) return null;
    return u.href;
  }

  function formaterDate(iso) {
    if (!iso) return null;
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function formaterMontant(prix) {
    if (prix === null || prix === undefined) return '—';
    try { return Number(prix).toLocaleString('fr-FR') + ' €'; }
    catch (e) { return String(prix) + ' €'; }
  }

  function afficherEtatSimple(icone, titre, message) {
    zone.innerHTML =
      '<div class="etat-simple">' +
        '<div class="icone" aria-hidden="true">' + icone + '</div>' +
        '<h1>' + echapperHtml(titre) + '</h1>' +
        '<p>' + echapperHtml(message) + '</p>' +
      '</div>';
  }

  function badgeStatut(statut) {
    if (statut === 'accepte') return '<span class="badge accepte">Accepté</span>';
    if (statut === 'refuse') return '<span class="badge refuse">Refusé</span>';
    return '<span class="badge attente">En attente de réponse</span>';
  }

  // ────────────────────────────────────────────────────────────
  // Modal générique — confirmation d'acceptation OU saisie du motif
  // de refus, selon le mode demandé.
  // ────────────────────────────────────────────────────────────
  var voileModal = document.getElementById('voile-modal');
  var modalTitre = document.getElementById('modal-titre');
  var modalTexte = document.getElementById('modal-texte');
  var modalZoneChamp = document.getElementById('modal-zone-champ');
  var modalErreur = document.getElementById('modal-erreur');
  var modalBoutonAnnuler = document.getElementById('modal-bouton-annuler');
  var modalBoutonConfirmer = document.getElementById('modal-bouton-confirmer');

  function fermerModal() {
    voileModal.hidden = true;
    modalZoneChamp.innerHTML = '';
    modalErreur.style.display = 'none';
    modalErreur.textContent = '';
    // V50.5D.3E-A — retire le verrouillage d'arrière-plan à la
    // fermeture. fermerModal() n'est jamais appelée pendant un
    // traitement réseau réellement en cours : le bouton Annuler est
    // déjà bloqué par `if (enCoursTraitement) return;` ci-dessous, et
    // l'appel après succès (dans lancerAccept/lancerRefuse, non
    // modifiées) n'intervient qu'une fois definirEtatTraitement(false)
    // déjà exécuté.
    _deverrouillerScrollArrierePlan();
  }
  modalBoutonAnnuler.addEventListener('click', function () {
    if (enCoursTraitement) return; // ne pas fermer pendant un appel réseau en cours
    fermerModal();
  });

  // V50.5D.3E-A — Verrouillage robuste du scroll d'arrière-plan pendant
  // qu'une modale ACCEPT/REFUSE est ouverte. Un simple overflow:hidden
  // sur <body> ne bloque pas fiablement le scroll tactile sur Safari
  // iOS ; on utilise donc position:fixed avec capture/restauration
  // exacte de la position (même technique déjà validée côté
  // Dashboard). Sur desktop (≥769px), l'effet reste le simple
  // overflow:hidden (règle CSS correspondante scopée au mobile) —
  // aucun changement visuel desktop.
  var _scrollYAvantModalDevis = 0;
  function _verrouillerScrollArrierePlan() {
    _scrollYAvantModalDevis = window.scrollY || window.pageYOffset || 0;
    document.body.style.setProperty('--scroll-lock-top', (-_scrollYAvantModalDevis) + 'px');
    document.body.classList.add('scroll-verrouille');
  }
  function _deverrouillerScrollArrierePlan() {
    document.body.classList.remove('scroll-verrouille');
    document.body.style.removeProperty('--scroll-lock-top');
    window.scrollTo(0, _scrollYAvantModalDevis);
  }

  function ouvrirModalAccepter(devis) {
    modalTitre.textContent = 'Confirmer l\'acceptation';
    modalTexte.textContent = 'Confirmez-vous l\'acceptation du devis ' + (devis.reference || '') + ' pour ' + formaterMontant(devis.prix) + ' ?';
    modalZoneChamp.innerHTML = '';
    modalBoutonConfirmer.className = 'bouton bouton-confirmer-accept';
    modalBoutonConfirmer.textContent = 'Confirmer l\'acceptation';
    modalBoutonConfirmer.onclick = function () { lancerAccept(); };
    _verrouillerScrollArrierePlan();
    voileModal.hidden = false;
  }

  function ouvrirModalRefuser(devis) {
    modalTitre.textContent = 'Refuser le devis';
    modalTexte.textContent = 'Souhaitez-vous indiquer la raison de votre refus ? (facultatif)';
    modalZoneChamp.innerHTML =
      '<textarea class="modal-champ" id="modal-champ-motif" maxlength="' + MOTIF_LONGUEUR_MAX + '" placeholder="Raison de votre refus (facultatif)"></textarea>' +
      '<div class="modal-compteur"><span id="modal-compteur-valeur">0</span>/' + MOTIF_LONGUEUR_MAX + '</div>';
    var champ = document.getElementById('modal-champ-motif');
    var compteur = document.getElementById('modal-compteur-valeur');
    champ.addEventListener('input', function () { compteur.textContent = String(champ.value.length); });
    modalBoutonConfirmer.className = 'bouton bouton-confirmer-refus';
    modalBoutonConfirmer.textContent = 'Confirmer le refus';
    modalBoutonConfirmer.onclick = function () { lancerRefuse(); };
    _verrouillerScrollArrierePlan();
    voileModal.hidden = false;
  }

  function afficherErreurModal(message) {
    modalErreur.textContent = message;
    modalErreur.style.display = 'block';
  }

  var libelleConfirmerOriginal = ''; // mémorise le libellé exact avant "Traitement…"

  function definirEtatTraitement(actif) {
    enCoursTraitement = actif;
    modalBoutonConfirmer.disabled = actif;
    modalBoutonAnnuler.disabled = actif;
    if (actif) {
      libelleConfirmerOriginal = modalBoutonConfirmer.textContent;
      modalBoutonConfirmer.textContent = 'Traitement…';
    } else {
      modalBoutonConfirmer.textContent = libelleConfirmerOriginal || modalBoutonConfirmer.textContent;
    }
    var boutonAccepter = document.getElementById('bouton-accepter-devis');
    var boutonRefuser = document.getElementById('bouton-refuser-devis');
    if (boutonAccepter) boutonAccepter.disabled = actif;
    if (boutonRefuser) boutonRefuser.disabled = actif;
  }

  // ────────────────────────────────────────────────────────────
  // Appel générique vers l'Edge Function pour accept/refuse — jamais
  // d'en-tête Authorization Supabase, la seule preuve est le token.
  // ────────────────────────────────────────────────────────────
  function appellerAction(action, motif) {
    var corps = { action: action, token: token };
    if (action === 'refuse') corps.motif = motif || undefined;
    return fetch(URL_FONCTION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    }).then(function (reponse) {
      return reponse.json().then(function (corpsReponse) {
        return { statutHttp: reponse.status, corps: corpsReponse };
      }).catch(function () {
        return { statutHttp: reponse.status, corps: null };
      });
    });
  }

  function lancerAccept() {
    if (enCoursTraitement) return; // protection double-clic
    if (!token) { afficherErreurModal('Session invalide. Rechargez la page.'); return; }
    definirEtatTraitement(true);
    appellerAction('accept', null)
      .then(function (resultat) {
        definirEtatTraitement(false);
        var corps = resultat.corps;
        if (!corps || corps.ok !== true) {
          afficherErreurModal((corps && corps.message) || 'Une erreur est survenue. Merci de réessayer.');
          return;
        }
        fermerModal();
        // Source de vérité unique : on ne fabrique aucune date localement
        // (la réponse accept/refuse n'en renvoie pas) — on relit l'état
        // réel via GET, qui lui renvoie date_acceptation/date_refus.
        chargerEtAfficherDevis();
      })
      .catch(function () {
        definirEtatTraitement(false);
        afficherErreurModal('Problème de connexion. Merci de réessayer.');
      });
  }

  function lancerRefuse() {
    if (enCoursTraitement) return; // protection double-clic
    if (!token) { afficherErreurModal('Session invalide. Rechargez la page.'); return; }
    var champ = document.getElementById('modal-champ-motif');
    var motif = champ ? champ.value.slice(0, MOTIF_LONGUEUR_MAX) : null;
    definirEtatTraitement(true);
    appellerAction('refuse', motif)
      .then(function (resultat) {
        definirEtatTraitement(false);
        var corps = resultat.corps;
        if (!corps || corps.ok !== true) {
          afficherErreurModal((corps && corps.message) || 'Une erreur est survenue. Merci de réessayer.');
          return;
        }
        fermerModal();
        chargerEtAfficherDevis();
      })
      .catch(function () {
        definirEtatTraitement(false);
        afficherErreurModal('Problème de connexion. Merci de réessayer.');
      });
  }

  // ────────────────────────────────────────────────────────────
  // Affichage principal : le VRAI PDF officiel en grand, jamais une
  // reconstruction du contenu du devis en HTML.
  // ────────────────────────────────────────────────────────────
  function blocPdf(devis) {
    var urlPdf = urlPdfValideOuNull(devis.pdf_url);
    if (!devis.pdf_disponible || !urlPdf) {
      return '<div class="pdf-cadre"><p class="pdf-indispo">Le PDF de ce devis n\'est pas disponible pour le moment.</p></div>';
    }
    // "#view=FitH" est un fragment d'URL : jamais transmis au serveur,
    // n'affecte ni la signature ni les paramètres de l'URL signée —
    // c'est une simple instruction au visualiseur PDF du navigateur pour
    // qu'il s'ajuste à la largeur disponible.
    var urlPdfAffichage = urlPdf + '#view=FitH';
    return (
      '<div class="pdf-cadre"><iframe src="' + echapperHtml(urlPdfAffichage) + '" title="Devis PDF HelixCar"></iframe></div>' +
      '<a class="bouton bouton-pdf" href="' + echapperHtml(urlPdf) + '" target="_blank" rel="noopener">Ouvrir / télécharger le PDF</a>'
    );
  }

  function blocActions(devis) {
    if (devis.statut === 'accepte') {
      return '<div class="statut-final accepte"><div><strong>Devis accepté</strong>' +
        (devis.date_acceptation ? echapperHtml('le ' + formaterDate(devis.date_acceptation)) : '') +
        '</div></div>';
    }
    if (devis.statut === 'refuse') {
      // Le motif de refus n'est pas exposé par la réponse GET actuelle
      // (voir rapport) — non affiché ici pour ne rien inventer.
      return '<div class="statut-final refuse"><div><strong>Devis refusé</strong>' +
        (devis.date_refus ? echapperHtml('le ' + formaterDate(devis.date_refus)) : '') +
        '</div></div>';
    }
    return (
      '<div class="question-actions">Que souhaitez-vous faire ?</div>' +
      '<div class="decision-groupe">' +
        '<button class="bouton bouton-accepter" id="bouton-accepter-devis">Accepter le devis</button>' +
        '<button class="bouton bouton-refuser" id="bouton-refuser-devis">Refuser le devis</button>' +
      '</div>'
    );
  }

  function afficherDevis(devis) {
    var html = '';
    html += '<div class="entete-devis">';
    html += '<div><div class="titre-devis">Votre devis</div><div class="reference">' + echapperHtml(devis.reference || '—') + '</div></div>';
    html += '</div>';
    html += '<div>' + badgeStatut(devis.statut) + '</div>';
    html += blocPdf(devis);
    html += blocActions(devis);

    zone.innerHTML = html;

    var boutonAccepter = document.getElementById('bouton-accepter-devis');
    var boutonRefuser = document.getElementById('bouton-refuser-devis');
    if (boutonAccepter) boutonAccepter.addEventListener('click', function () { ouvrirModalAccepter(devis); });
    if (boutonRefuser) boutonRefuser.addEventListener('click', function () { ouvrirModalRefuser(devis); });
  }

  // ────────────────────────────────────────────────────────────
  // GET — source de vérité unique, utilisée au chargement initial ET
  // après un accept/refuse réussi (objectif 4 : refresh cohérent).
  // ────────────────────────────────────────────────────────────
  function chargerEtAfficherDevis() {
    if (!token) {
      afficherEtatSimple('⚠️', 'Lien de devis invalide.', 'Le lien que vous avez utilisé ne contient pas les informations nécessaires. Vérifiez qu\'il a été copié en entier depuis votre email.');
      return;
    }

    fetch(URL_FONCTION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get', token: token })
    })
      .then(function (reponse) {
        return reponse.json().then(function (corps) {
          return { statutHttp: reponse.status, corps: corps };
        }).catch(function () {
          return { statutHttp: reponse.status, corps: null };
        });
      })
      .then(function (resultat) {
        var corps = resultat.corps;
        if (!corps || corps.ok !== true) {
          var code = corps && corps.code;
          if (code === 'INVALID_OR_EXPIRED_LINK') {
            afficherEtatSimple('🔒', 'Lien invalide ou expiré.', 'Ce lien de devis est invalide ou a expiré. Contactez HelixCar si vous pensez qu\'il s\'agit d\'une erreur.');
          } else {
            afficherEtatSimple('⚠️', 'Impossible d\'afficher ce devis.', 'Une erreur est survenue. Merci de réessayer dans quelques instants.');
          }
          return;
        }
        afficherDevis(corps.devis);
      })
      .catch(function () {
        afficherEtatSimple('📡', 'Problème de connexion.', 'Impossible de contacter HelixCar pour le moment. Vérifiez votre connexion internet et réessayez.');
      });
  }

  chargerEtAfficherDevis();
})();
</script>
</body>
</html>
