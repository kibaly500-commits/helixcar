<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelixCar — Créer mon compte convoyeur</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', sans-serif; background: #0A1628;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    background: #FAFAF7; border-radius: 16px; padding: 36px 32px; max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .logo { display:flex; align-items:center; gap:10px; font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; margin-bottom: 18px; }
  .logo-badge { background:#F5C518; color:#0D0D0D; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  h2 { font-family:'Syne',sans-serif; margin: 0 0 6px; font-size: 1.3rem; }
  p.sub { color:#666; font-size:.88rem; margin: 0 0 22px; line-height:1.5; }
  .form-group { margin-bottom: 14px; }
  label { display:block; font-size:.8rem; font-weight:600; margin-bottom: 5px; color:#333; }
  input {
    width:100%; padding:11px 13px; border:1.5px solid #ddd; border-radius:9px;
    font-family:inherit; font-size:.9rem; outline:none;
  }
  input:focus { border-color:#2556A8; }
  input[readonly] { background:#f0efe9; color:#666; }
  /* Lot A01 — même neutralisation du fond bleu d'autoremplissage que sur
     le site : le fond peint par le navigateur se limite aux glyphes, et
     les gestionnaires de mots de passe continuent de fonctionner. */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: #333; caret-color: #333;
    transition: background-color 100000s ease-in-out 0s;
  }
  input:autofill { background-clip: text; -webkit-text-fill-color: #333; }
  /* Edge (Chromium) ajoute son propre bouton de révélation du mot de
     passe : il ferait doublon avec le bouton œil de cette page. */
  input::-ms-reveal, input::-ms-clear { display: none; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 40px; }
  .pw-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 8px;
    line-height: 0; color: #888; border-radius: 3px;
    min-width: 34px; min-height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover, .pw-toggle:focus-visible { color: #C8102E; }
  .pw-toggle.actif { color: #C8102E; }
  .btn {
    width:100%; padding:13px; border:none; border-radius:9px; background:#0D0D0D; color:#fff;
    font-weight:700; font-size:.92rem; cursor:pointer; margin-top:6px;
  }
  .btn:disabled { opacity:.6; cursor:default; }
  .alert { border-radius:9px; padding:12px 14px; font-size:.83rem; margin-top:14px; display:none; }
  .alert-error { background:rgba(239,68,68,.1); color:#C2410C; border:1.5px solid rgba(239,68,68,.3); }
  .alert-success { background:rgba(34,197,94,.1); color:#166534; border:1.5px solid rgba(34,197,94,.3); }
  .hint { font-size:.75rem; color:#888; margin-top:4px; }
</style>
</head>
<body>

<div class="box">
  <div class="logo"><div class="logo-badge">HC</div> HelixCar</div>
  <h2>Créer mon compte convoyeur</h2>
  <p class="sub" id="cc-sub">Ton dossier est validé ! Choisis un mot de passe pour accéder à ton espace convoyeur et voir les missions disponibles.</p>

  <div id="form-zone">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="cc-email" placeholder="ton@email.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <div class="pw-wrap">
        <input type="password" id="cc-pw" placeholder="8 caractères minimum" minlength="8" data-mdp="1"
               autocomplete="new-password" style="padding-right:44px">
        <button type="button" class="pw-toggle" onclick="basculerMotDePasse('cc-pw', this)"
                aria-label="Afficher le mot de passe" title="Afficher le mot de passe" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="hint">Minimum 8 caractères.</div>
    </div>
    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <div class="pw-wrap">
        <input type="password" id="cc-pw2" placeholder="••••••••" minlength="8" data-mdp="1"
               autocomplete="new-password" style="padding-right:44px" onkeydown="if(event.key==='Enter')creerCompte()">
        <button type="button" class="pw-toggle" onclick="basculerMotDePasse('cc-pw2', this)"
                aria-label="Afficher le mot de passe" title="Afficher le mot de passe" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button class="btn" id="cc-btn" onclick="creerCompte()">Créer mon compte →</button>
  </div>

  <div id="cc-error" class="alert alert-error"></div>
  <div id="cc-success" class="alert alert-success"></div>
</div>

<script>
const SUPABASE_URL = 'https://zsetmqnmmupqbkgqbjbo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZXRtcW5tbXVwcWJrZ3FiamJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjI4OTgsImV4cCI6MjA5NjkzODg5OH0.wpxgmRXpoa6BI9P9Ybu6OXwmK9x6mPU3dxpiwf11gFc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Pré-remplit l'email depuis le lien reçu par email : creer-compte-convoyeur.html?email=xxx
(function() {
  var params = new URLSearchParams(window.location.search);
  var email = params.get('email');
  if (email) {
    var emailInput = document.getElementById('cc-email');
    emailInput.value = email;
    emailInput.readOnly = true;
  }
})();

// ── AFFICHER / MASQUER UN MOT DE PASSE ──
// Même comportement et même icône que le site public et le Dashboard.
// Bascule UNIQUEMENT le type du champ ; la valeur n'est ni lue, ni
// copiée, ni mémorisée nulle part.
function basculerMotDePasse(id, bouton) {
  var el = document.getElementById(id);
  if (!el) return;
  var doitAfficher = el.type === 'password';

  var debut = null, fin = null;
  try { debut = el.selectionStart; fin = el.selectionEnd; } catch (e) {}

  el.type = doitAfficher ? 'text' : 'password';

  try {
    el.focus({ preventScroll: true });
    if (debut !== null && fin !== null) el.setSelectionRange(debut, fin);
  } catch (e) {}

  if (bouton) {
    var libelle = doitAfficher ? 'Masquer le mot de passe' : 'Afficher le mot de passe';
    bouton.classList.toggle('actif', doitAfficher);
    bouton.setAttribute('aria-pressed', String(doitAfficher));
    bouton.setAttribute('aria-label', libelle);
    bouton.setAttribute('title', libelle);
  }
}

// Conservé comme alias : d'anciens appels peuvent subsister.
function togglePw(inputId, btn) { basculerMotDePasse(inputId, btn); }

// LOT A3/B1 — l'origine officielle, construite, jamais codee en dur
// sur le deploiement d'apercu.
function _ccOrigineOfficielle() {
  try {
    var o = window.location.origin;
    if (o && /^https:/.test(o)) return o;
  } catch (e) {}
  return 'https://helixcar.vercel.app';
}

function showError(msg) {
  var el = document.getElementById('cc-error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('cc-success').style.display = 'none';
}

async function creerCompte() {
  var email = document.getElementById('cc-email').value.trim();
  var pw = document.getElementById('cc-pw').value;
  var pw2 = document.getElementById('cc-pw2').value;
  var btn = document.getElementById('cc-btn');

  if (!email) { showError('Merci de renseigner ton email.'); return; }
  if (pw.length < 8) { showError('Le mot de passe doit contenir au moins 8 caractères.'); return; }
  if (pw !== pw2) { showError('Les mots de passe ne correspondent pas.'); return; }

  // Vérifie que cet email correspond bien à un convoyeur validé
  btn.disabled = true; btn.textContent = 'Vérification…';
  try {
    var checkResp = await fetch(SUPABASE_URL + '/rest/v1/convoyeurs?email=eq.' + encodeURIComponent(email) + '&select=id,statut,prenom&order=created_at.desc&limit=1', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    var rows = await checkResp.json();
    if (!rows || rows.length === 0) {
      showError('Aucun dossier convoyeur trouvé avec cet email. Vérifie l\'adresse ou contacte HelixCar.');
      btn.disabled = false; btn.textContent = 'Créer mon compte →';
      return;
    }
    if (rows[0].statut !== 'actif') {
      showError('Ton dossier n\'est pas encore validé par l\'équipe HelixCar. Réessaie une fois validé.');
      btn.disabled = false; btn.textContent = 'Créer mon compte →';
      return;
    }
    var convoyeurId = rows[0].id;
  } catch (e) {
    showError('Erreur de vérification (voir la console).');
    console.error(e);
    btn.disabled = false; btn.textContent = 'Créer mon compte →';
    return;
  }

  // ══════════════════════════════════════════════════════════════
  // LOT B1 — UNE SEULE IDENTITE PAR ADRESSE
  // ══════════════════════════════════════════════════════════════
  // CE QUI ETAIT FAIT, ET QUI NE POUVAIT PAS MARCHER :
  //
  //   * on appelait signUp() sans jamais se demander si un compte
  //     existait deja pour cette adresse. Une personne DEJA CLIENTE
  //     chez HelixCar se voyait donc proposer un SECOND mot de passe
  //     pour la meme adresse — ce que Supabase ne cree pas, et ce que
  //     le lot B1 interdit explicitement ;
  //
  //   * puis on rattachait la fiche par un PATCH direct sur
  //     `convoyeurs.auth_user_id` AVEC LA CLE ANON. La RLS refuse cette
  //     ecriture : PostgREST repond 204 avec ZERO ligne modifiee. Le
  //     rattachement n'avait donc jamais lieu, en silence — et s'il
  //     avait ete accepte, n'importe qui aurait pu s'attribuer la fiche
  //     d'un autre en connaissant son adresse.
  //
  // DESORMAIS : on essaie D'ABORD de se connecter avec l'adresse et le
  // mot de passe saisis. Si le compte existe et que le mot de passe est
  // le bon, on ne cree rien : on ajoute seulement le role manquant, par
  // une fonction serveur qui verifie elle-meme l'adresse confirmee
  // (migration 104). Sinon seulement, on cree le compte.
  btn.textContent = 'Vérification du compte…';
  try {
    var connexion = await sb.auth.signInWithPassword({ email: email, password: pw });
    var dejaUnCompte = !!(connexion && connexion.data && connexion.data.session);

    if (dejaUnCompte) {
      // Le compte existe deja et le mot de passe est le bon : on
      // n'en cree surtout pas un second. On ajoute le role.
      btn.textContent = 'Ajout de ton espace convoyeur…';
      var ajout = await sb.rpc('ajouter_role_partenaire', { p_convoyeur_id: convoyeurId });
      var code = (ajout && ajout.data && ajout.data.code) || '';
      if (ajout && ajout.error) {
        showError('Ton espace convoyeur n\'a pas pu être ajouté. Réessaie dans quelques instants.');
        btn.disabled = false; btn.textContent = 'Créer mon compte →';
        return;
      }
      if (code === 'ADRESSE_NON_CONFIRMEE') {
        showError('Confirme d\'abord ton adresse e-mail (regarde tes messages, et les spams), puis reviens ici.');
        btn.disabled = false; btn.textContent = 'Créer mon compte →';
        return;
      }
      if (code !== 'RATTACHEE' && code !== 'DEJA_RATTACHEE' && code !== 'ROLE_DEJA_PRESENT') {
        showError('Ce dossier convoyeur ne correspond pas à ce compte. Contacte HelixCar.');
        btn.disabled = false; btn.textContent = 'Créer mon compte →';
        return;
      }
      document.getElementById('cc-error').style.display = 'none';
      document.getElementById('form-zone').style.display = 'none';
      document.getElementById('cc-sub').style.display = 'none';
      var dejaEl = document.getElementById('cc-success');
      dejaEl.innerHTML = 'Tu as déjà un compte HelixCar avec cette adresse : '
        + 'ton espace convoyeur vient d\'y être ajouté. '
        + 'Connecte-toi comme d\'habitude, avec le MÊME mot de passe.';
      dejaEl.style.display = 'block';
      return;
    }

    // Mot de passe refusé : soit le compte n'existe pas — et on le crée
    // juste après — soit il existe avec un AUTRE mot de passe. Dans ce
    // second cas, signUp() ne créera rien et l'on ne doit surtout pas
    // annoncer un compte créé. Le message reste neutre : il ne dit
    // jamais si l'adresse est déjà connue.
    btn.textContent = 'Création du compte…';
    var result = await sb.auth.signUp({
      email: email,
      password: pw,
      options: { emailRedirectTo: _ccOrigineOfficielle() + '/dashboard.html' }
    });
    if (result.error) {
      showError('Erreur : ' + result.error.message);
      btn.disabled = false; btn.textContent = 'Créer mon compte →';
      return;
    }

    // Le rattachement de la fiche ne peut se faire QU'AVEC une session
    // reelle : c'est la fonction serveur qui verifie l'adresse
    // confirmee. Sans session (confirmation d'e-mail encore requise),
    // il aura lieu a la premiere connexion.
    if (result.data && result.data.session) {
      try { await sb.rpc('ajouter_role_partenaire', { p_convoyeur_id: convoyeurId }); }
      catch (e) { console.error('Rattachement du role partenaire :', e); }
    }

    document.getElementById('cc-error').style.display = 'none';
    document.getElementById('form-zone').style.display = 'none';
    document.getElementById('cc-sub').style.display = 'none';
    var successEl = document.getElementById('cc-success');
    var needsConfirm = !result.data.session; // pas de session = confirmation email requise
    successEl.innerHTML = needsConfirm
      ? '📬 Dernière étape : va voir tes emails (pense à vérifier les spams) et clique sur le lien de confirmation — tu seras redirigé directement sur ton espace convoyeur, déjà connecté.'
      : '✅ Compte créé ! Tu peux te connecter directement sur ton espace convoyeur.';
    successEl.style.display = 'block';
  } catch (e) {
    showError('Erreur inattendue (voir la console).');
    console.error(e);
    btn.disabled = false; btn.textContent = 'Créer mon compte →';
  }
}
</script>

</body>
</html>
